# ALNILAM Issue #94 — isolated CNB Cloud Build Playwright/CLS pilot.
# Only for an authorized ALNILAM test branch hosted on CNB, not the ADS repository.
# GitHub PR events alone do not trigger CNB. Does not build/publish releases.
chore/94-cnb-browser-ci-pilot:
  push:
    - &browser_pilot
      name: alnilam-browser-cls-pilot
      runner:
        tags: cnb:arch:amd64
        cpus: 2
      docker:
        image: mcr.microsoft.com/playwright:v1.64.1-noble
      env:
        CI: "true"
        ALNILAM_CNB_BROWSER_PILOT: "1"
      stages:
        - name: Verify browser runner
          script: |
            set -eu
            node -v
            node -e 'if (process.versions.node.split(".").map(Number)[0] < 24) process.exit(2)'
            npm install -g pnpm@10.19.0
            pnpm --version
        - name: Reuse existing ALNILAM build and tests
          script: |
            set -eu
            pnpm install --frozen-lockfile
            pnpm test
            pnpm check
            pnpm build
            test -s dist/site/index.html
            test -s dist/site/posts/hello-alnilam/index.html
        - name: Browser and CLS baseline
          script: |
            set -eu
            # Pinned pilot tooling outside pnpm workspace; promote into lockfile after proof.
            npm install --prefix .cnb-browser-tools --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.1
            mkdir -p artifacts/cnb-browser
            set +e
            node scripts/ci/cnb-browser-audit.mjs --output dist/site > artifacts/cnb-browser/run.log 2>&1
            status=$?
            set -e
            cat artifacts/cnb-browser/run.log
            printf '%s\n' "$status" > artifacts/cnb-browser/status.txt
        - name: Package remote browser evidence
          script: |
            set -eu
            tar -czf artifacts/alnilam-cnb-browser-evidence.tgz -C artifacts cnb-browser
            test -s artifacts/alnilam-cnb-browser-evidence.tgz
        - name: Upload trace and screenshots to CNB commit
          # Pilot uses documented latest; pin immutable version/digest before required-gate use.
          image: cnbcool/attachments:latest
          settings:
            attachments:
              - "artifacts/alnilam-cnb-browser-evidence.tgz"
            ttl: 14
        - name: Final deterministic browser gate
          script: |
            set -eu
            test -s artifacts/cnb-browser/status.txt
            test "$(cat artifacts/cnb-browser/status.txt)" = 0
            echo "CNB Browser Pilot PASS for test commit: ${CNB_COMMIT:-unknown}"
dev:
  pull_request:
    - *browser_pilot

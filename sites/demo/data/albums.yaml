# Original Site-owned field-atlas artwork is documented in assets/gallery/AUTHORSHIP.md.
# Thumbnail SVGs are compact local previews; each full SVG remains the viewer original.
schemaVersion: 1
albums:
  - id: coast-and-mountains
    title: Coast and Mountains
    description: A four-stop field route from the last light on the coast to a quiet alpine lake.
    date: 2026-11-18
    location: North Pacific field route
    tags: [coast, mountains, field]
    layout: grid
    columns: 3
    cover: gallery/coast-dusk-thumb.svg
    photos:
      - id: coast-dusk
        src: gallery/coast-dusk.svg
        thumbnail: gallery/coast-dusk-thumb.svg
        alt: Rose evening sun above dark headlands and a blue-green sea
        location: Gull Point
        title: The last light at Gull Point
        description: The sun held above the headland long enough for the water to turn copper.
        date: 2026-11-18
        width: 1600
        height: 1000
      - id: alpine-lake
        src: gallery/alpine-lake.svg
        thumbnail: gallery/alpine-lake-thumb.svg
        alt: Pale alpine peaks and dark pines reflected in still turquoise water
        location: Moraine basin
        title: Still water beneath the moraine
        description: A quiet morning reflection with the snow line just above the tree band.
        date: 2026-11-17
        width: 1800
        height: 1200
      - id: sea-stack
        src: gallery/sea-stack.svg
        thumbnail: gallery/sea-stack-thumb.svg
        alt: Tall basalt sea stack rising from blue water after rain
        location: West cove
        title: Basalt after rain
        description: A break in the cloud left one warm patch of light on the stack.
        date: 2026-11-16
        width: 1000
        height: 1500
      - id: cloud-study
        src: gallery/cloud-study.svg
        alt: Blue-gray cloud bands opening above a violet evening ridge
        location: Ridge overlook
        title: A study in moving cloud
        description: The last clear strip of sky kept a single evening star visible.
        date: 2026-11-15
        width: 1600
        height: 1000
  - id: tidal-sketchbook
    title: Tidal Sketchbook
    description: Patterns left by the falling tide, recorded from water level and reed edge.
    date: 2026-11-12
    location: Estuary field station
    tags: [tide, coast, field]
    layout: masonry
    columns: 2
    cover: gallery/tidal-flat-thumb.svg
    photos:
      - id: outgoing-tide
        src: gallery/tidal-flat.svg
        thumbnail: gallery/tidal-flat-thumb.svg
        alt: Blue-green tide pools winding through a broad warm sand flat
        location: South reach
        title: Pools on the outgoing tide
        description: Small pools kept the color of the open water as the sand emerged.
        date: 2026-11-12
        width: 1600
        height: 1000
      - id: reed-bank
        src: gallery/reed-bank.svg
        alt: Thin green reeds rising before a still inlet and rounded hills
        location: North channel
        title: The reed edge at high water
        description: The water stayed quiet while the reeds marked the depth of the channel.
        date: 2026-11-11
        width: 1500
        height: 900
      - id: tide-stack
        src: gallery/sea-stack.svg
        thumbnail: gallery/sea-stack-thumb.svg
        alt: A narrow basalt stack above the late afternoon tide
        location: West cove
        title: The tide below the stack
        description: A second view of the same coast at a lower tide.
        date: 2026-11-10
        width: 1000
        height: 1500
  - id: forest-field-notes
    title: Forest Field Notes
    description: A cover-free sketchbook of paths, trees, and the small observations between them.
    date: 2026-11-08
    location: Cedar ridge
    tags: [forest, field, sketchbook]
    layout: grid
    columns: 3
    photos:
      - id: pine-trail
        src: gallery/pine-trail.svg
        thumbnail: gallery/pine-trail-thumb.svg
        alt: A pale winding trail between deep green pines toward a warm clearing
        location: Cedar ridge
        title: The path through the pines
        description: The trail bends around the old trees before opening to the afternoon light.
        date: 2026-11-08
        width: 1000
        height: 1400
      - id: field-notebook
        src: gallery/field-notes.svg
        alt: An open cream notebook filled with contour-like field marks on a teal desk
        location: Field station
        title: Notes between walks
        description: A paper ledger keeps route marks beside observations that need another visit.
        date: 2026-11-07
        width: 1200
        height: 1200
      - id: lake-return
        src: gallery/alpine-lake.svg
        alt: Turquoise water reflecting a pale ridge and a line of dark pines
        location: Moraine basin
        title: The return route
        description: The same lake looks different when the clouds begin to lift.
        date: 2026-11-06
        width: 1800
        height: 1200

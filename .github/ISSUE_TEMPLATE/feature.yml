name: Feature request
description: Suggest an improvement to ALNILAM
title: "[Feature] "
body:
  - type: textarea
    id: objective
    attributes:
      label: What problem would this solve?
      description: Describe the use case and who would benefit.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Proposed behavior and alternatives
      description: Describe the expected result and alternatives you considered. Omit secrets and private data.
    validations:
      required: true


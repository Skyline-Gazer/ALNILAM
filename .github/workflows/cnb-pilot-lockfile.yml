name: CNB Pilot Lockfile
on:
  push:
    branches: [chore/94-cnb-browser-ci-pilot]
    paths: [package.json, .github/workflows/cnb-pilot-lockfile.yml]
permissions:
  contents: read
jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: pnpm install --lockfile-only --ignore-scripts
      - uses: actions/upload-artifact@v4
        with:
          name: cnb-pilot-lockfile
          path: pnpm-lock.yaml
          if-no-files-found: error
